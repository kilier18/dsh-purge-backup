# dsh-preset-kit bundle patch
#
# 校准 + 评测台都在本插件内（lib/arena、presets/arena、skills/arena）。
# 只装 dsh-preset-kit，不外接、不 link 其它评测包。

# 关掉旧的独立评测包行（若用户以前装过 dsh-arena-mode）
- id: arena-store
  name: dsh-arena-store
  disabled: true

- id: arena-ui
  name: dsh-arena-ui
  disabled: true

- id: arena-mode
  name: dsh-arena-mode
  disabled: true

- id: arena-mode-store
  name: dsh-arena-mode/store
  disabled: true

- id: arena-mode-ui
  name: dsh-arena-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体 insert 写在用户层 profile/cordis.patch.yml（postinstall / 评测台自愈补）。
# 这里只改已入队条目的 inject/config。再 insert 一次会 already queued（#152 / #154 / #159）。
- id: dsh-preset-kit
  name: dsh-preset-kit
  inject: [systemPrompt, tools]
  config:
    enabled: true
    autoApplyOnStart: false
    autoUpdateOnStart: false
    autoRevertOnMissing: false
    injectOnce: false
    stripMnemon: true
    verbose: false
    postPrompt: ""
    postPromptOrder: 5100
    autoRetry: true
    retryMax: 3
    autoContinue: false
    continueMax: 3
    continueText: "继续"
    capabilityProtocol: true
    hooksDenyBypass: true
    anchorMode: auto
    subagentControl: true

- insert:
    # 评测台：预设 + 技能落地（本插件 lib/arena）
    - id: dsh-preset-kit-arena
      name: dsh-preset-kit/arena

    # 评测台事实库（SQLite），数据在 $DSH_HOME/arena
    - id: dsh-preset-kit-arena-store
      name: dsh-preset-kit/arena/store
      config:
        root: !!js dshHomePath('arena')

    # 评测台 HTTP 桥 POST /arena/api
    - id: dsh-preset-kit-arena-ui
      name: dsh-preset-kit/arena/ui
